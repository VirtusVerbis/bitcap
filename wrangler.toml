name = "bitcap"
main = "src/adapters/worker/index.ts"
compatibility_date = "2024-11-01"

# CF_TIER: "free" (default) = no KV; "paid" = rate limit + block counter (requires BITCAP_KV below)
[vars]
CF_TIER = "free"

# Paid tier only — create: wrangler kv namespace create BITCAP_KV
# Set CF_TIER = "paid" and uncomment:
# [[kv_namespaces]]
# binding = "BITCAP_KV"
# id = "<YOUR_NAMESPACE_ID>"

[[routes]]
pattern = "bitcoinpunchup.com/*"
zone_name = "bitcoinpunchup.com"

[[routes]]
pattern = "bitcoinbloodhound.com/*"
zone_name = "bitcoinbloodhound.com"

[assets]
directory = "assets"
binding = "ASSETS"