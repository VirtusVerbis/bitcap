name = "bitcap"
main = "src/adapters/worker/index.ts"
compatibility_date = "2024-11-01"

# Create KV: wrangler kv namespace create BITCAP_KV
# Set id below; optional preview_id for wrangler dev
[[kv_namespaces]]
binding = "BITCAP_KV"
id = "e6f90b76b6e14e3cb2963419afddd41f"

# Route: attach in dashboard or uncomment when zone_id is known
[[routes]]
pattern = "bitcoinpunchup.com/*"
zone_name = "bitcoinpunchup.com"

[assets]
directory = "assets"
binding = "ASSETS"